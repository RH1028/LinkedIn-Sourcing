<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 300px;
      padding: 14px;
      margin: 0;
    }
    h1 {
      font-size: 13px;
      margin: 0 0 10px;
      color: #1a73e8;
    }
    button {
      width: 100%;
      padding: 8px;
      background: #1a73e8;
      color: white;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #1557b0; }
    button:disabled { background: #999; cursor: wait; }
    #out { margin-top: 12px; font-size: 12px; line-height: 1.5; }
    .ok { color: #0a8a3c; font-weight: 600; }
    .err { color: #c53030; }
    ul { padding-left: 18px; margin: 6px 0; }
    li { margin: 2px 0; }
    .hint { color: #888; font-size: 11px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>LinkedIn Sourcing PoC</h1>
  <button id="scan">Scan current page</button>
  <div id="out"></div>
  <div class="hint">Open DevTools console (⌘⌥I) for full results.</div>
  <script src="popup.js"></script>
</body>
</html>
